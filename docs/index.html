<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRONMAN 70.3 — Fortschritt</title>
<style>
  :root {
    --deep:    #0B1F2E;
    --water:   #12384F;
    --lane:    #1D5C7A;
    --tile:    #C9DEE6;
    --chalk:   #F2F6F7;
    --signal:  #F0A202;
    --alarm:   #D64545;
    --go:      #4FA96B;
    --mute:    #6E8B99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--deep);
    color: var(--chalk);
    font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* --- Kopf: Woche als Bahnen-Metapher --- */
  header { margin-bottom: 40px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--mute); margin-bottom: 10px;
  }
  h1 {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(38px, 7vw, 64px);
    font-weight: 800; letter-spacing: -0.03em; line-height: 0.95;
    margin-bottom: 6px;
  }
  h1 span { color: var(--lane); }
  .sub { color: var(--mute); font-size: 13px; }

  /* Bahnen-Leiste: 26 Wochen */
  .lanes {
    display: grid; grid-template-columns: repeat(26, 1fr);
    gap: 3px; margin: 24px 0 8px; height: 34px;
  }
  .lane {
    background: var(--water); border-radius: 2px; position: relative;
  }
  .lane.done { background: var(--lane); }
  .lane.now  { background: var(--signal); }
  .lane.rec  { background: repeating-linear-gradient(45deg, var(--water), var(--water) 3px, var(--deep) 3px, var(--deep) 6px); }
  .lane.rec.done { background: repeating-linear-gradient(45deg, var(--lane), var(--lane) 3px, var(--water) 3px, var(--water) 6px); }
  .lane-key { display: flex; gap: 16px; font-size: 11px; color: var(--mute); }
  .lane-key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* --- Ampeln --- */
  .flags { margin: 32px 0; display: grid; gap: 8px; }
  .flag {
    display: grid; grid-template-columns: 4px 92px 1fr; gap: 14px;
    align-items: center; background: var(--water);
    padding: 12px 14px; border-radius: 3px;
  }
  .flag .bar { width: 4px; height: 100%; min-height: 28px; border-radius: 2px; }
  .flag.red   .bar { background: var(--alarm); }
  .flag.amber .bar { background: var(--signal); }
  .flag.green .bar { background: var(--go); }
  .flag .metric { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); }
  .flag .text { font-size: 13px; }

  /* --- Kennzahlen --- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 3px; }
  .cell {
    background: var(--water); padding: 18px 16px 16px;
    border-radius: 3px; position: relative; overflow: hidden;
  }
  .cell .label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--mute); margin-bottom: 8px;
  }
  .cell .val {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 30px; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1;
  }
  .cell .unit { font-size: 13px; font-weight: 400; color: var(--mute); margin-left: 3px; }
  .cell .goal { font-size: 11px; color: var(--mute); margin-top: 7px; }
  .cell .track { height: 3px; background: var(--deep); border-radius: 2px; margin-top: 10px; }
  .cell .track i { display: block; height: 100%; background: var(--lane); border-radius: 2px; }
  .cell.empty .val { color: var(--mute); font-size: 20px; font-weight: 400; }

  h2 {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--mute); margin: 42px 0 12px; font-weight: 600;
  }

  /* --- Chart --- */
  .chart { background: var(--water); border-radius: 3px; padding: 18px; }
  svg { width: 100%; height: auto; display: block; }

  /* --- Tabelle --- */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th {
    text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--mute); font-weight: 500;
    padding: 8px 10px; border-bottom: 1px solid var(--water);
  }
  td { padding: 9px 10px; border-bottom: 1px solid rgba(18,56,79,0.5); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 2px; background: var(--water); color: var(--tile);
  }
  .tag.swim { background: #1D5C7A; }
  .tag.bike { background: #2E5C3F; }
  .tag.gym  { background: #5C4A1D; }
  .tag.walk { background: #4A5C1D; }
  .tag.run  { background: #7A3A1D; }
  .tag.mobility { background: #3A1D5C; }
  .tag.cardio { background: #5C1D3A; }
  .tag.other { background: #3A3A3A; }

  /* Countdown */
  .countdown {
    margin: 16px 0 4px; padding: 12px 16px; background: var(--water);
    border-radius: 3px; border-left: 3px solid var(--signal); font-size: 13px;
  }
  .cd-num { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 26px;
    font-weight: 700; color: var(--signal); margin-right: 4px; }
  .cd-sub { color: var(--mute); font-size: 11.5px; display: block; margin-top: 3px; }

  /* Progress je Sportart */
  .sports { display: grid; gap: 3px; }
  .sport-row { background: var(--water); border-radius: 3px; padding: 13px 15px; }
  .s-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .s-week { font-size: 11.5px; color: var(--tile); }
  .s-week.ok { color: var(--go); }
  .s-week.muted { color: var(--mute); }
  .s-stats { display: flex; gap: 18px; font-size: 12px; color: var(--mute); flex-wrap: wrap; }
  .s-stats b { color: var(--chalk); font-variant-numeric: tabular-nums; }
  .sport-row .track { height: 3px; background: var(--deep); border-radius: 2px; margin-top: 10px; }
  .sport-row .track i { display: block; height: 100%; background: var(--lane); border-radius: 2px; }

  /* Leistungszonen */
  .zones { background: var(--water); border-radius: 3px; padding: 18px; }
  .zone-bar { display: flex; height: 28px; border-radius: 3px; overflow: hidden; background: var(--deep); }
  .zone-bar div { min-width: 2px; transition: width .3s; }
  .zone-key { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 11.5px; color: var(--mute); }
  .zone-key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .zone-key b { color: var(--chalk); }
  .zone-note { margin-top: 14px; font-size: 11.5px; color: var(--mute); line-height: 1.6; }

  footer { margin-top: 48px; font-size: 11px; color: var(--mute); }

  @media (max-width: 640px) {
    .lanes { grid-template-columns: repeat(13, 1fr); grid-auto-rows: 22px; height: auto; }
    .flag { grid-template-columns: 4px 1fr; }
    .flag .metric { display: none; }
    table { font-size: 11.5px; }
    td, th { padding: 7px 5px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .cell, .flag { animation: rise .4s ease-out backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  }
</style>
</head>

const fmtPace = s => s ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}` : '–';
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function cell(label, val, unit, goal, pct) {
  if (val === null || val === undefined)
    return `<div class="cell empty"><div class="label">${label}</div>
            <div class="val">keine Daten</div><div class="goal">${goal || ''}</div></div>`;
  return `<div class="cell">
    <div class="label">${label}</div>
    <div class="val">${val}${unit ? `<span class="unit">${unit}</span>` : ''}</div>
    ${goal ? `<div class="goal">${goal}</div>` : ''}
    ${pct !== undefined ? `<div class="track"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div>` : ''}
  </div>`;
}

function lanes() {
  const cur = D.plan.current_week;
  let out = '';
  for (let w = 1; w <= 26; w++) {
    const cls = ['lane'];
    if (w < cur) cls.push('done');
    if (w === cur) cls.push('now');
    if (w % 4 === 0) cls.push('rec');
    out += `<div class="${cls.join(' ')}" title="Woche ${w}"></div>`;
  }
  return out;
}

function sparkline(series, key, invert) {
  if (!series.length) return '<div class="chart" style="color:var(--mute);font-size:12px">Noch keine Daten.</div>';
  const vals = series.map(p => p[key]).filter(v => v != null);
  if (vals.length < 2) return '<div class="chart" style="color:var(--mute);font-size:12px">Zu wenige Datenpunkte.</div>';
  const min = Math.min(...vals), max = Math.max(...vals), range = (max - min) || 1;
  const W = 900, H = 160, pad = 24;
  const pts = series.filter(p => p[key] != null).map((p, i, arr) => {
    const x = pad + (i / (arr.length - 1 || 1)) * (W - pad * 2);
    let norm = (p[key] - min) / range;
    if (invert) norm = 1 - norm;
    const y = H - pad - norm * (H - pad * 2);
    return [x, y];
  });
  const line = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const area = `${line} L${pts.at(-1)[0].toFixed(1)},${H-pad} L${pts[0][0].toFixed(1)},${H-pad} Z`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">
    <path d="${area}" fill="rgba(29,92,122,0.35)"/>
    <path d="${line}" fill="none" stroke="#4FA96B" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(([x,y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#F2F6F7"/>`).join('')}
    <text x="${pad}" y="16" fill="#6E8B99" font-size="11">${max.toFixed(1)}</text>
    <text x="${pad}" y="${H-6}" fill="#6E8B99" font-size="11">${min.toFixed(1)}</text>
  </svg></div>`;
}

        an.race_power_longest_min && an.race_power_target_min ? an.race_power_longest_min/an.race_power_target_min*100 : undefined)}
    ${cell('Rad Quality-Minuten', an.bike_quality_min || null, ' min',
        `Soll ${an.bike_quality_target_min||90} min/Woche · ${an.bike_sessions_analyzed||0} Ausfahrten (FTP ${an.ftp_used})`,
        an.bike_quality_min && an.bike_quality_target_min ? an.bike_quality_min/an.bike_quality_target_min*100 : undefined)}
    ${cell('Aeroposition', an.aero_minutes_week || null, ' min',
        'Min/Woche in Position · trägst du in manual.json ein')}
    ${cell('Schwimmen längste', an.swim_longest_km || null, ' km',
        `Renndistanz ${an.swim_race_km} km`, an.swim_longest_km ? an.swim_longest_km/an.swim_race_km*100 : undefined)}
    ${cell('Gehen/Laufen längste', an.walkrun_longest_km || null, ' km',
        `Renndistanz ${an.walkrun_race_km} km · ${an.walkrun_total_km||0} km gesamt`, an.walkrun_longest_km ? an.walkrun_longest_km/an.walkrun_race_km*100 : undefined)}
  `;})()}
</div>

<div class="zone-note">Die Rennleistung ist das Ziel, das Pacing kommt aus der Messung: ${esc(t.pacing_rule || "")}</div>

<h2>Prognose auf den Renntag</h2>
${(() => {
  const f = D.forecast || {};
  if (!f.weight && !f.ftp && !f.css) return '<div class="zone-note">Noch zu wenig Daten für eine Hochrechnung. Sobald Gewichtstrend und Testwerte (ftp_w, css_s in manual.json) vorliegen, erscheint hier die lineare Projektion auf den 24.04.2027.</div>';
  const fmtCss = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
  const chip = ok => ok ? '<span style="color:#2E5C3F;font-weight:700">auf Kurs</span>' : '<span style="color:#C9700A;font-weight:700">unter Plan</span>';
  let html = '<div class="grid">';
  if (f.weight) html += cell('Gewicht projiziert', f.weight.projected, ' kg',
      `Ziel ${f.weight.target} kg · aktuell ${f.weight.current} · ${f.weight.on_track?'auf Kurs':'unter Plan'}`);
  if (f.ftp) html += cell('FTP aktuell', f.ftp.current, ' W',
      `Ziel ${f.ftp.target} W · Soll heute ${f.ftp.due_now} W · Lücke ${f.ftp.gap>0?f.ftp.gap+' W':'erreicht'} · ${f.ftp.on_track?'auf Kurs':'unter Plan'}`);
  if (f.css) html += cell('CSS aktuell', fmtCss(f.css.current), '',
      `Ziel ${fmtCss(f.css.target)} /100m · ${f.css.gap>0?'noch '+f.css.gap+'s':'erreicht'}`);
  html += '</div><div class="zone-note">Lineare Hochrechnung des aktuellen Trends — kein Versprechen, sondern ein Frühindikator. Weicht die Projektion Monate vorher vom Ziel ab, ist jetzt Zeit gegenzusteuern, nicht erst in der Testwoche.</div>';
  return html;
})()}



<h2>Rad – Zeit in den Leistungszonen</h2>
${(() => {
  const z = (D.analysis || {}).bike_zone_min || {};
  const order = [['recovery','Erholung <55%'],['endurance','Grundlage 55-75%'],['tempo','Tempo 75-88%'],
    ['sweetspot','Sweet Spot 88-95%'],['threshold','Schwelle 95-105%'],['vo2','VO2max >105%']];
  const total = Object.values(z).reduce((a,b)=>a+b,0) || 1;
  const colors = {recovery:'#2E5C3F',endurance:'#1D5C7A',tempo:'#3A7CA5',sweetspot:'#F0A202',threshold:'#E07B39',vo2:'#D64545'};
  return `<div class="zones">
    <div class="zone-bar">
      ${order.map(([k,l]) => z[k] ? `<div style="width:${z[k]/total*100}%;background:${colors[k]}" title="${l}: ${z[k]} min"></div>` : '').join('')}
    </div>
    <div class="zone-key">
      ${order.map(([k,l]) => `<span><i style="background:${colors[k]}"></i>${l}: <b>${z[k]||0}</b> min</span>`).join('')}
    </div>
    <div class="zone-note">Sweet Spot und Schwelle sind die Währung, die FTP kauft. Der Anteil rechts der Mitte zeigt, ob du wirklich Qualität fährst oder nur Kilometer sammelst.</div>
  </div>`;
})()}

<h2>Trainingslast-Verlauf</h2>
${sparkline((D.analysis||{}).load_trend || [], 'load', false)}

<h2>Gewichtsverlauf</h2>
${sparkline(D.weights, 'kg', true)}

<h2>Ruhepuls</h2>
${sparkline(D.rhr, 'bpm', true)}

<h2>Letzte Einheiten</h2>
<table>
  <thead><tr><th>Datum</th><th>Sport</th><th>Einheit</th><th class="num">Dauer</th><th class="num">Distanz</th><th class="num">Ø HF</th><th class="num">NP / Pace</th><th class="num">RPE</th></tr></thead>
  <tbody>
  ${D.activities.slice(0,14).map(a => `<tr>
    <td>${a.date.slice(5)}</td>
    <td><span class="tag ${a.sport}">${a.sport}</span></td>
    <td>${esc(a.name)}</td>
    <td class="num">${a.duration_min} min</td>
    <td class="num">${a.distance_km ? a.distance_km + ' km' : '–'}</td>
    <td class="num">${a.avg_hr || '–'}</td>
    <td class="num">${a.sport === 'swim' ? fmtPace(a.pace_per_100m) : (a.norm_power ? a.norm_power + ' W' : '–')}</td>
    <td class="num" style="${a.rpe_garmin ? '' : 'color:var(--mute)'}">${a.rpe_garmin || '–'}</td>
  </tr>`).join('')}
  </tbody>
</table>

<footer>
  Erzeugt ${D.generated_at} · Garmin Connect (inkl. Zwift) + Oura · FTP, CSS und Taille kommen aus data/manual.json
</footer>`;
</script>
</body>
</html>
